name: 🧪 CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_build:
    name: 🧪 Lint and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: ⬇️ Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🥡 Setup pnpm
        id: setup-pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: 🟢 Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 🧩 Install Dependencies
        id: install-deps
        run: pnpm install --frozen-lockfile

      # Build & Lint

      - name: 🌟 Lint
        id: lint
        run: pnpm lint

      - name: 🧪 Test
        id: test
        run: pnpm test

      - name: 🏗️ Build
        id: build-monorepo
        shell: bash
        # Note: Skip the Tauri template build because it requires native system toolchains
        run: pnpm exec turbo run build --filter='!@template/desktop-tauri'

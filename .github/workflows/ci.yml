name: 🧪 CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.15.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_build:
    name: 🧪 Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Setup node
      # https://github.com/actions/setup-node

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Setup pnpm & Install dependencies
      # https://github.com/pnpm/action-setup?tab=readme-ov-file#use-cache-to-reduce-installation-time

      - name: 🥡 Setup pnpm ${{ env.PNPM_VERSION }}
        id: setup-pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: 🎈 Get pnpm store directory
        id: get-pnpm-store-dir
        run: |
          echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: 🔆 Cache pnpm modules
        id: cache-pnpm-modules
        uses: actions/cache@v4
        with:
          path: ${{ steps.get-pnpm-store-dir.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 🧩 Install Dependencies
        id: install-deps
        run: pnpm install --frozen-lockfile

      # Build & Lint

      - name: 🌟 Lint
        id: lint
        run: pnpm lint

      - name: 🧪 Test
        id: test
        run: pnpm test

      - name: 🏗️ Build
        id: build-monorepo
        shell: bash
        # Note: Skip the Tauri template build because it requires native system toolchains
        run: pnpm exec turbo run build --filter='!@template/desktop-tauri'

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Split Flap Board — Dev Preview</title>
		<script type="module" src="./main.ts"></script>
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 3rem;
				background: #f0f0f0;
				color: #555;
				font-family: monospace;
				font-size: 0.75rem;
			}

			/* ── Spool grid ────────────────────────────────────────── */

			.spool-grid {
				display: flex;
				flex-wrap: wrap;
				gap: 1.5rem 2.5rem;
				justify-content: center;
			}

			.spool-cell {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.4rem;
			}

			.label {
				color: #999;
			}

			/* ── Control panel ─────────────────────────────────────── */

			.panel {
				background: #fff;
				border: 1px solid #ddd;
				border-radius: 8px;
				padding: 1.25rem 1.5rem;
				display: grid;
				grid-template-columns: max-content 1fr max-content;
				align-items: center;
				gap: 0.5rem 1rem;
				width: 480px;
			}

			.panel-title {
				grid-column: 1 / -1;
				font-weight: bold;
				color: #333;
				margin-bottom: 0.25rem;
			}

			.panel label {
				color: #666;
				white-space: nowrap;
			}

			.panel input[type='range'] {
				width: 100%;
			}

			.panel .val {
				color: #333;
				text-align: right;
				min-width: 3.5rem;
			}

			.panel-divider {
				grid-column: 1 / -1;
				border: none;
				border-top: 1px solid #eee;
				margin: 0.25rem 0;
			}
		</style>
	</head>
	<body>
		<!--
			Board demo — quote rotator.
			Spools are set once; only `grid` changes on each transition so
			every cell steps forward through chars rather than snapping.
		-->
		<split-flap-board
			id="quotes-board"
			variant="realistic"
			style="--sfb-bg: #111; --sfb-gap: 2px;"
		></split-flap-board>

		<!-- Individual spool variants — all synced to the control panel below -->
		<div class="spool-grid">
			<div class="spool-cell">
				<split-flap-spool id="minimal"></split-flap-spool>
				<span class="label">minimal</span>
			</div>
			<div class="spool-cell">
				<split-flap-spool id="realistic" variant="realistic"></split-flap-spool>
				<span class="label">realistic · char</span>
			</div>
			<div class="spool-cell">
				<split-flap-spool id="numeric" variant="realistic"></split-flap-spool>
				<span class="label">realistic · numeric</span>
			</div>
			<div class="spool-cell">
				<split-flap-spool id="color" variant="realistic"></split-flap-spool>
				<span class="label">realistic · color</span>
			</div>
			<div class="spool-cell">
				<split-flap-spool id="demo" variant="realistic"></split-flap-spool>
				<span class="label">realistic · all types</span>
			</div>
		</div>

		<!-- Control panel — applies to all spools and the board -->
		<div class="panel">
			<span class="panel-title">spool</span>

			<label for="ctrl-speed">speed (ms/step)</label>
			<input type="range" id="ctrl-speed" min="50" max="3000" step="50" value="200" />
			<span class="val" id="val-speed">200ms</span>

			<label for="ctrl-side-count">visible side count</label>
			<input type="range" id="ctrl-side-count" min="-1" max="20" step="1" value="5" />
			<span class="val" id="val-side-count">5</span>

			<label for="ctrl-radius">drum radius (px)</label>
			<input type="range" id="ctrl-radius" min="0" max="80" step="1" value="30" />
			<span class="val" id="val-radius">30px</span>

			<label for="ctrl-crease">crease gap (px)</label>
			<input type="range" id="ctrl-crease" min="0" max="6" step="0.5" value="1" />
			<span class="val" id="val-crease">1px</span>

			<label for="ctrl-max-angle">max step angle</label>
			<input type="range" id="ctrl-max-angle" min="0" max="20" step="0.5" value="0" />
			<span class="val" id="val-max-angle">off</span>

			<label for="ctrl-rotation">side rotation (°)</label>
			<input type="range" id="ctrl-rotation" min="0" max="90" step="1" value="0" />
			<span class="val" id="val-rotation">0°</span>

			<label for="ctrl-width">width (px)</label>
			<input type="range" id="ctrl-width" min="8" max="120" step="2" value="24" />
			<span class="val" id="val-width">auto</span>

			<label for="ctrl-height">height (px)</label>
			<input type="range" id="ctrl-height" min="8" max="120" step="2" value="24" />
			<span class="val" id="val-height">auto</span>

			<hr class="panel-divider" />
			<span class="panel-title">char flap</span>

			<label for="ctrl-font-size">font size (rem)</label>
			<input type="range" id="ctrl-font-size" min="0.5" max="5" step="0.25" value="2" />
			<span class="val" id="val-font-size">2rem</span>
		</div>
	</body>
</html>

# https://pnpm.io/pnpm-workspace_yaml
packages:
  - 'apps/*'
  - 'packages/*'
  - 'templates/*'
  - 'examples/**'

allowBuilds:
  # Required by Vite and Vitest tooling
  esbuild: true
  # Optional dependency of piscina via camaro; denied because camaro is only xml-tokenizer benchmark/playground tooling
  nice-napi: false

# Avoid auto-installing before clean scripts that remove node_modules
verifyDepsBeforeRun: false

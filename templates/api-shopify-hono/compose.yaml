services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: shopify_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shopify_app']
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
